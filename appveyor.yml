# The default image (Visual Studio 2015) has no recent Python versions
image: Visual Studio 2022

platform: x64

environment:

  matrix:
    - PYTHON: "C:\\Python27"
      PYTHON_VERSION: "2.7.x"
      PYTHON_ARCH: "32"

    - PYTHON: "C:\\Python27-x64"
      PYTHON_VERSION: "2.7.x"
      PYTHON_ARCH: "64"

    - PYTHON: "C:\\Python35"
      PYTHON_VERSION: "3.5.x"
      PYTHON_ARCH: "32"

    - PYTHON: "C:\\Python35-x64"
      PYTHON_VERSION: "3.5.x"
      PYTHON_ARCH: "64"

    - PYTHON: "C:\\Python36"
      PYTHON_VERSION: "3.6.x"
      PYTHON_ARCH: "32"

    - PYTHON: "C:\\Python36-x64"
      PYTHON_VERSION: "3.6.x"
      PYTHON_ARCH: "64"

    - PYTHON: "C:\\Python37"
      PYTHON_VERSION: "3.7.x"
      PYTHON_ARCH: "32"

    - PYTHON: "C:\\Python37-x64"
      PYTHON_VERSION: "3.7.x"
      PYTHON_ARCH: "64"

    - PYTHON: "C:\\Python38"
      PYTHON_VERSION: "3.8.x"
      PYTHON_ARCH: "32"

    - PYTHON: "C:\\Python38-x64"
      PYTHON_VERSION: "3.8.x"
      PYTHON_ARCH: "64"

    - PYTHON: "C:\\Python39"
      PYTHON_VERSION: "3.9.x"
      PYTHON_ARCH: "32"

    - PYTHON: "C:\\Python39-x64"
      PYTHON_VERSION: "3.9.x"
      PYTHON_ARCH: "64"

    - PYTHON: "C:\\Python310"
      PYTHON_VERSION: "3.10.x"
      PYTHON_ARCH: "32"

    - PYTHON: "C:\\Python310-x64"
      PYTHON_VERSION: "3.10.x"
      PYTHON_ARCH: "64"

    - PYTHON: "C:\\Python311"
      PYTHON_VERSION: "3.11.x"
      PYTHON_ARCH: "32"

    - PYTHON: "C:\\Python311-x64"
      PYTHON_VERSION: "3.11.x"
      PYTHON_ARCH: "64"

    - PYTHON: "C:\\Python312"
      PYTHON_VERSION: "3.12.x"
      PYTHON_ARCH: "32"

    - PYTHON: "C:\\Python312-x64"
      PYTHON_VERSION: "3.12.x"
      PYTHON_ARCH: "64"

    - PYTHON: "C:\\Python313"
      PYTHON_VERSION: "3.13.x"
      PYTHON_ARCH: "32"

    - PYTHON: "C:\\Python313-x64"
      PYTHON_VERSION: "3.13.x"
      PYTHON_ARCH: "64"

    - PYTHON: "C:\\Python314"
      PYTHON_VERSION: "3.14.x"
      PYTHON_ARCH: "32"
      # Installed from nuget.org when the image does not have it
      PYTHON_NUGET: "3.14.0"

    - PYTHON: "C:\\Python314-x64"
      PYTHON_VERSION: "3.14.x"
      PYTHON_ARCH: "64"
      # Installed from nuget.org when the image does not have it
      PYTHON_NUGET: "3.14.0"

init:
  - "ECHO %PYTHON% %PYTHON_VERSION% %PYTHON_ARCH%"

install:
  - ps: |
      if (-not (Test-Path "$env:PYTHON\python.exe")) {
        if (-not $env:PYTHON_NUGET) {
          throw "$env:PYTHON\python.exe is not on this image"
        }
        $package = if ($env:PYTHON_ARCH -eq "32") { "pythonx86" } else { "python" }
        nuget install $package -Version $env:PYTHON_NUGET -ExcludeVersion -OutputDirectory C:\nuget-python
        if ($LastExitCode -ne 0) { throw "nuget install $package failed" }
        Copy-Item -Recurse "C:\nuget-python\$package\tools" $env:PYTHON
      }
  - set "PATH=%PYTHON%;%PYTHON%\\Scripts;%PYTHON%\\Tools\\Scripts;%PATH%"
  # Fail instead of silently testing another interpreter found on PATH
  - python -c "import os, struct, sys; want = (os.environ['PYTHON_VERSION'][:-2], os.environ['PYTHON_ARCH']); got = ('{0}.{1}'.format(*sys.version_info), str(struct.calcsize('P') * 8)); print(sys.executable, sys.version); assert got == want, (got, want)"
  - python -m pip --version || python -m ensurepip
  - python -m pip install --upgrade pip
  - pip install -r tests/requirements.txt

build: off

test_script:
  - python setup.py install
  - pytest --showlocals --durations=10 -n auto tests

