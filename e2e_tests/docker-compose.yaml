---
version: "2.1"
services:
  ssh:
    image: linuxserver/openssh-server:version-9.1_p1-r2
    container_name: openssh-server
    hostname: openssh-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
      - PUBLIC_KEY_FILE=/config/ssh_host_keys/ssh_host_rsa_key.pub
      - SUDO_ACCESS=false
      - PASSWORD_ACCESS=false
      - USER_NAME=linuxserver
      - LISTEN_PORT=2222
    volumes:
      - ./ssh-server-config:/config/ssh_host_keys
    ports:
      - "127.0.0.1:2223:2222"
    networks:
      - inner

  postgresdb:
    image: postgres:13.0
    command: ["postgres", "-c", "log_statement=all"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: main
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d main"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      inner:
        ipv4_address: 10.5.0.5

  mysqldb:
    image: mysql:8.0.33
    environment:
      MYSQL_DATABASE: main
      MYSQL_USER: mysql
      MYSQL_PASSWORD: mysql
      MYSQL_ROOT_PASSWORD: mysqlroot
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -umysql -pmysql --silent"]
      interval: 2s
      timeout: 3s
      retries: 60
    networks:
      inner:
        ipv4_address: 10.5.0.6

  mongodb:
    image: mongo:3.6.23
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
      MONGO_INITDB_DATABASE: main
    healthcheck:
      test: ["CMD-SHELL", "mongo --quiet --eval 'db.adminCommand(\"ping\")'"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      inner:
        ipv4_address: 10.5.0.7

networks:
  inner:
    driver: bridge
    ipam:
     config:
       - subnet: 10.5.0.0/16
         gateway: 10.5.0.1
