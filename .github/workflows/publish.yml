name: Publish

# Release flow: bump __version__ in sshtunnel.py, update changelog.rst, merge to
# master, then push (on master) a tag `X.Y.Z` that matches __version__.
#
# Same stages as the old CircleCI pipeline:
#   tests -> testdeploy (TestPyPI) -> manual approval -> deploy (PyPI)
# The approval step is the "pypi" environment: add Required reviewers to it in
# the repository settings.
on:
  push:
    tags: [ '[0-9]+.[0-9]+.[0-9]+*' ]

jobs:
  # Tag triggers cannot be filtered by branch, so check it explicitly:
  # the tagged commit must be reachable from master.
  check-branch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check that the tag is on master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
            echo "Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on master, refusing to publish" >&2
            exit 1
          fi

  tests:
    needs: check-branch
    uses: ./.github/workflows/tests.yml

  e2e:
    needs: check-branch
    uses: ./.github/workflows/database.yml

  build:
    needs: [tests, e2e]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check that the tag matches __version__
        run: |
          VERSION=$(python -c "import re; print(re.search(r\"__version__\s*=\s*'([^']+)'\", open('sshtunnel.py').read()).group(1))")
          if [ "${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match __version__ ${VERSION}" >&2
            exit 1
          fi
      - name: Build artifacts
        run: |
          python -m pip install --upgrade pip setuptools wheel twine
          python setup.py bdist_wheel sdist
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testdeploy:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Upload to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TESTPYPI_TOKEN }}
        run: |
          python -m pip install twine
          twine upload --repository testpypi --skip-existing dist/*

  deploy:
    needs: testdeploy
    runs-on: ubuntu-22.04
    environment:
      name: pypi  # configure Required reviewers here (the old "hold" step)
      url: https://pypi.org/project/sshtunnel/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m pip install twine
          twine upload --skip-existing dist/*

  github-release:
    needs: deploy
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --repo "${GITHUB_REPOSITORY}"
          --title "${GITHUB_REF_NAME}"
          --generate-notes
