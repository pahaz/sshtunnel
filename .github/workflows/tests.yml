name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r tests/requirements.txt
      - name: Run test suite
        run: >-
          python -m pytest tests
          --showlocals
          --durations=10
          -n auto
          -W ignore::DeprecationWarning
          --cov sshtunnel
          --cov-report=term
          --cov-report=html:test_results/coverage.html
          --cov-report=lcov:test_results/coverage.lcov
          --junit-xml=test_results/report.xml
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: test_results/coverage.lcov
          flag-name: py${{ matrix.python-version }}
          parallel: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test_results/

  coveralls-finish:
    needs: tests
    runs-on: ubuntu-22.04
    steps:
      - name: Coveralls finish
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true

  syntax:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r tests/requirements-syntax.txt
      - name: Check MANIFEST.in
        run: check-manifest --ignore "tox.ini,tests*,*.yml"
      - name: Check RST syntax
        run: |
          python setup.py sdist
          twine check dist/*
      - name: Check PEP8 compliancy
        run: flake8
      - name: Check CLI help
        run: bashtest README.rst

  docs:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r docs/requirements.txt
      - name: Build documentation
        run: sphinx-build -WavE -b html docs _build/html
      - uses: actions/upload-artifact@v4
        with:
          name: sshtunnel-docs
          path: _build/html
