# Release pipeline (tests and checks run in GitHub Actions, see .github/workflows).
#
#   testdeploy (TestPyPI) -> hold (manual approval) -> deploy (PyPI)
#
# Manual run only: pushes do not start anything. Needs TESTPYPI_TOKEN and
# PYPI_TOKEN project environment variables in CircleCI.
#
# To release: bump __version__ in sshtunnel.py, update changelog.rst, merge to
# master, then in CircleCI press "Trigger Pipeline" for branch master with the
# parameter `release` (boolean) = true, and approve the `hold` job.
version: 2.1

parameters:
  release:
    type: boolean
    default: false

executors:
  python:
    docker:
      - image: cimg/python:3.11

jobs:
  testdeploy:
    description: Build and upload artifacts to Test PyPI
    executor: python
    steps:
      - checkout
      - run:
          name: Install build tools
          command: pip install --upgrade pip setuptools wheel twine
      - run:
          name: Build artifact
          command: python setup.py bdist_wheel sdist
      - run:
          name: Check artifacts
          command: twine check dist/*
      - store_artifacts:
          path: dist/
      - run:
          name: Upload to TestPyPI
          command: >-
            twine upload
            --repository testpypi
            --username __token__
            --password $TESTPYPI_TOKEN
            --skip-existing
            dist/*

  deploy:
    description: Build and upload artifacts to PyPI
    executor: python
    steps:
      - checkout
      - run:
          name: Install build tools
          command: pip install --upgrade pip setuptools wheel twine
      - run:
          name: Build artifact
          command: python setup.py bdist_wheel sdist
      - run:
          name: Upload to PyPI
          command: >-
            twine upload
            --username __token__
            --password $PYPI_TOKEN
            --skip-existing
            dist/*

workflows:
  deploy:
    when: << pipeline.parameters.release >>
    jobs:
      - testdeploy:
          filters:
            branches:
              only: master

      - hold:
          type: approval
          requires:
            - testdeploy
          filters:
            branches:
              only: master

      - deploy:
          requires:
            - hold
          filters:
            branches:
              only: master
