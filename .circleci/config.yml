params: &params
  parameters:
    version:
      description: Python docker image version
      default: 3.9.16
      type: string

job_defaults: &job_defaults
  <<: *params
  executor:
    name: python
    version: << parameters.version >>

# Tests/checks run on every push. The release (TestPyPI -> approval -> PyPI) is
# manual: press "Trigger Pipeline" for branch master with the pipeline
# parameter `release` (boolean) = true, then approve the `hold` job.
# Needs TESTPYPI_TOKEN, PYPI_TOKEN (and COVERALLS_REPO_TOKEN) in the project's
# environment variables.
version: 2.1

parameters:
  release:
    type: boolean
    default: false

executors:
  python:
    <<: *params
    docker:
      - image: cimg/python:<< parameters.version >>

jobs:
  tests:
    description: Run test suite for a specific python version
    <<: *job_defaults
    steps:
      - checkout
      - restore_cache: &restore_cache
          keys:
            - sshtunnel-py<< parameters.version >>-{{ checksum "sshtunnel.py" }}-{{ checksum "tests/requirements.txt" }}-0
      - run: &install
          name: Install sshtunnel and build&test dependencies
          command: |
            python --version
            pipenv --version
            pip --version
            pipenv install -e .
            pipenv install --dev -r tests/requirements.txt
            cat Pipfile.lock
          environment:
            - PIPENV_VENV_IN_PROJECT: 1
      - save_cache: &save_cache
          key: sshtunnel-py<< parameters.version >>-{{ checksum "sshtunnel.py" }}-{{ checksum "tests/requirements.txt" }}-0
          paths:
            - .venv/
      - run:
          name: Run test suite
          command: >-
            pipenv run py.test tests
            --showlocals
            --durations=10
            -n4
            -W ignore::DeprecationWarning
            --cov sshtunnel
            --cov-report=html:test_results/coverage.html
            --cov-report=term
            --junit-xml=test_results/report.xml
      - run:
          name: Coveralls
          command: pipenv run coveralls
      - store_test_results:
          path: test_results
      - store_artifacts:
          path: test_results

  docs:
    description: Produce documentation from source
    <<: *job_defaults
    steps:
      - checkout
      - restore_cache: *restore_cache
      - run: *install
      - save_cache: *save_cache
      - run:
          name: Installing documentation dependencies
          command: pipenv install --dev -r docs/requirements.txt
      - run:
          name: Build documentation
          command: pipenv run sphinx-build -WavE -b html docs _build/html
      - store_artifacts:
          path: _build/html
          destination: sshtunnel-docs

  syntax:
    description: Run syntax validation tests
    <<: *job_defaults
    steps:
      - checkout
      - restore_cache: *restore_cache
      - run: *install
      - save_cache: *save_cache
      - run:
          name: Installing syntax checks dependencies
          command: pipenv install --dev -r tests/requirements-syntax.txt
      - run:
          name: checking MANIFEST.in
          command: pipenv run check-manifest --ignore tox.ini,tests*,*.yml
      - run:
          name: checking RST syntax
          command: |
            pipenv run python setup.py sdist
            pipenv run twine check dist/*
      - run:
          name: checking PEP8 compliancy
          command: pipenv run flake8 --exclude .venv,build,docs,e2e_tests --max-complexity 10 --ignore=W504
      - run:
          name: checking CLI help
          command: pipenv run bashtest README.rst

  testdeploy:
    description: Build and upload artifacts to Test PyPI
    <<: *job_defaults
    steps:
      - checkout
      - run:
          name: Install build tools
          command: pip install --upgrade pip setuptools wheel twine
      - run:
          name: Build artifact
          command: python setup.py bdist_wheel sdist
      - run:
          name: Check artifacts
          command: twine check dist/*
      - store_artifacts:
          path: dist/
      - run:
          name: Upload to TestPyPI
          command: >-
            twine upload
            --repository testpypi
            --username __token__
            --password $TESTPYPI_TOKEN
            --skip-existing
            dist/*

  deploy:
    description: Build and upload artifacts to PyPI
    <<: *job_defaults
    steps:
      - checkout
      - run:
          name: Install build tools
          command: pip install --upgrade pip setuptools wheel twine
      - run:
          name: Build artifact
          command: python setup.py bdist_wheel sdist
      - run:
          name: Upload to PyPI
          command: >-
            twine upload
            --username __token__
            --password $PYPI_TOKEN
            --skip-existing
            dist/*

workflows:
  syntax_and_docs:
    when:
      not: << pipeline.parameters.release >>
    jobs:
      - syntax
      - docs

  tests:
    when:
      not: << pipeline.parameters.release >>
    jobs:
      - tests:
          matrix:
            parameters:
              version: &python_versions
                - "3.9"
                - "3.10"
                - "3.11"
                - "3.12"
                - "3.13"
                - "3.14"

  release:
    when: << pipeline.parameters.release >>
    jobs:
      - tests:
          matrix:
            parameters:
              version: *python_versions
      - syntax
      - docs
      - testdeploy:
          requires:
            - tests
            - syntax
            - docs
      - hold:
          type: approval
          requires:
            - testdeploy
      - deploy:
          requires:
            - hold
